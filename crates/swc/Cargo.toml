[package]
name = "mercury-hbc"
description = "SWC-based JavaScript and TypeScript compiler and decompiler for Hermes HBC 96"
readme = "README.md"
keywords = ["hermes", "bytecode", "swc", "javascript", "decompiler"]
categories = ["compilers", "development-tools", "parser-implementations"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
mercury-binary.workspace = true
mercury-ir.workspace = true
mercury-regex.workspace = true
mercury-spec.workspace = true
mercury-spec-builtin.workspace = true
num-bigint = "0.4"
swc_core = { version = "82.0.0", features = ["common", "ecma_ast", "ecma_parser", "ecma_parser_typescript", "ecma_codegen", "ecma_transforms_typescript", "ecma_transforms", "ecma_visit"] }
tempfile = "3"
thiserror.workspace = true
